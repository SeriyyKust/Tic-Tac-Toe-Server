name: tic-tac-toe-tests

services:
  db:
    image: postgres:16
    env_file: test.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build: ../server
    env_file: test.env
    environment:
      PYTHONPATH: /app:/workspace
    volumes:
      - ../server:/app
      - .:/workspace/tests:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py test tests.server --settings=tests.settings --noinput
