name: tic-tac-toe

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tic_tac_toe}
      POSTGRES_USER: ${POSTGRES_USER:-tic_tac_toe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tic_tac_toe}
      POSTGRES_USER: ${POSTGRES_USER:-tic_tac_toe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
    ports:
      - "${SERVER_BIND_HOST:?Set SERVER_BIND_HOST in .env}:${SERVER_PORT:-8000}:8000"
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
